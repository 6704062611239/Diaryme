<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ลงทะเบียน - Diaryme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-amber-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-amber-100">
        <div class="flex flex-col items-center mb-6">
    <img src="/static/logo.svg" alt="Diaryme Logo" class="w-16 h-16 mb-2 shadow-md rounded-2xl">
    <h1 class="text-2xl font-bold text-amber-800">Diaryme</h1>
</div>
        {% if error %}
            <div class="bg-red-100 text-red-600 p-3 rounded-lg text-sm mb-4 text-center">{{ error }}</div>
        {% endif %}
        <form action="/api/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-600 mb-1">Username</label>
                <input type="text" name="username" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-sm text-slate-600 mb-1">Email</label>
                <input type="email" name="email" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-sm text-slate-600 mb-1">Password</label>
                <input type="password" name="password" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-lg font-medium transition">สมัครสมาชิก</button>
        </form>
        <p class="text-center text-sm text-slate-500 mt-4">มีบัญชีอยู่แล้ว? <a href="/login" class="text-amber-600 font-semibold hover:underline">เข้าสู่ระบบ</a></p>
    </div>
</body>
</html>
